services:
  - type: web
    name: discord-class-bot
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://opencode.ai/zen/go/v1/chat/completions
      - key: TARGET_CHANNEL_IDS
        sync: false
      - key: INSTRUCTOR_IDS
        sync: false
      - key: HISTORY_LIMIT
        value: "5000"
      - key: PORT
        value: "8000"
